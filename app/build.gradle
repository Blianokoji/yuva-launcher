plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yuva.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.yuva.launcher"
        minSdk 28
        targetSdk 34
        // CI passes these from the git tag (v1.2.3 -> 1.2.3, code 10203); local builds keep the defaults
        versionCode = (project.findProperty("appVersionCode") ?: "10100").toString().toInteger()
        versionName = (project.findProperty("appVersionName") ?: "1.1.0").toString()
        ndk { abiFilters 'armeabi-v7a' }
    }

    signingConfigs {
        // Only defined when CI (or you) provide a keystore; otherwise release falls back to the debug key.
        if (System.getenv("KEYSTORE_FILE")) {
            release {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = System.getenv("KEYSTORE_FILE") ? signingConfigs.getByName("release") : signingConfigs.getByName("debug")
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint {
        textReport true
        textOutput file("$rootDir/lint-report.txt")
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'
}
