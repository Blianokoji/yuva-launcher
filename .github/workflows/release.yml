name: Release

# Publish by pushing a tag:  git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release and upload the APK

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          V="${TAG#v}"
          if ! [[ "$V" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          CODE=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]} ))
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$V" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Decode signing key (optional)
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with the debug key. Updates over a previous install will fail until you add a keystore."
          fi

      - name: Lint + build release APK
        env:
          KEYSTORE_FILE: ${{ steps.key.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew lintRelease assembleRelease --console=plain
          -PappVersionName=${{ steps.ver.outputs.name }}
          -PappVersionCode=${{ steps.ver.outputs.code }}

      - name: Name the APK
        run: |
          SUFFIX=$([ "${{ steps.key.outputs.signed }}" = "true" ] && echo "" || echo "-debugkey")
          cp app/build/outputs/apk/release/app-release*.apk "crimson-eclipse-${{ steps.ver.outputs.name }}${SUFFIX}.apk"
          sha256sum crimson-eclipse-*.apk | tee SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crimson-eclipse-*.apk
            SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.prerelease }}
          fail_on_unmatched_files: true
